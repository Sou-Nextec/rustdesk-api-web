name: Regressoes do cliente Nextec

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Integridade do repositorio (LF em patch/sh/yml, BOM em .ps1, serie de patches, ambiente de testes)
        run: node nextec/testes/verificar-integridade.mjs
      - name: Validar preparacao autorizada da conexao, nomes do template e rodape da versao
        run: node --test nextec/testes/*.test.mjs
      - name: Navegacao entre telas (monta o painel e percorre as rotas A, B, A, C)
        run: npx vitest run --config vitest.config.mjs
      - run: npm run build

  identity:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ativar-Nextec .cmd no PowerShell 5.1 (dados sujos reais, parse e fumaca)
        shell: powershell
        run: |
          node --test nextec/testes/activation-cmd.test.mjs nextec/testes/activation-cmd-dados-reais.test.mjs nextec/testes/ativar-cmd-instalacao.test.mjs nextec/testes/ativar-cmd-atomicidade.test.mjs nextec/testes/ativar-cmd-pacote-arvore.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Activation cmd regression failed' }
      - name: Validar identidade em Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File nextec/atualizacao/test_client_identity.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Identity regression failed' }
      - name: Preservar registro seguro do atualizador
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File nextec/atualizacao/test_registration.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Updater registration regression failed' }
      - name: Validar regravacao atomica no PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File nextec/atualizacao/test_atomic_replace.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Atomic replace regression failed' }
      - name: Validar journal e recuperacao da rotacao de senha
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File nextec/atualizacao/test_password_transaction.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Password transaction regression failed' }
      - name: Validar coordenador e tarefas de gerenciamento
        shell: powershell
        run: |
          foreach ($test in @('test_coordinator.ps1', 'test_agent_task_registration.ps1', 'test_updater_identity.ps1', 'test_agent_http.ps1', 'test_remove_tasks.ps1', 'test_agent_auth_recovery.ps1', 'test_agent_401_integration.ps1', 'test_self_enroll.ps1', 'test_painel_configuravel.ps1', 'test_invocar_rustdesk.ps1', 'test_client_settings_locked.ps1')) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "nextec/atualizacao/$test"
            if ($LASTEXITCODE -ne 0) { throw "Management regression failed: $test" }
          }
