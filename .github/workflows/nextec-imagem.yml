# Publica a imagem Nextec no GitHub Container Registry: ghcr.io/sou-nextec/rustdesk-nextec
#   - a cada push na master:  :latest  e  :master-<commit>
#   - ao criar uma tag v*:    :<versão>  (ex.: v1.0.1 gera :1.0.1)  e  :latest
#   - manualmente em Actions > Imagem Nextec > Run workflow
# Na master, depois de publicar, aciona o webhook do Portainer (segredo PORTAINER_WEBHOOK_URL).
# Antes de publicar, a imagem sobe num contêiner de teste e o painel precisa responder. Se não responder, nada é publicado.
name: Imagem Nextec

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'nextec/deploy/**'
      - 'nextec/atualizacao/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão extra para marcar (ex.: 1.0.1). Vazio = só latest'
        required: false

permissions:
  contents: read
  packages: write

# uma execução por vez em cada ref; um push novo cancela o build anterior que ainda não terminou
concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sou-nextec/rustdesk-nextec
  # imagem base lejianwen/rustdesk-server-s6 fixa; a API dela precisa bater com API_TAG do Dockerfile
  BASE_TAG: v0.1.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Marcas da imagem
        id: v
        run: |
          TAGS="${IMAGE}:latest"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME#v}"
          elif [ "${GITHUB_REF_NAME}" = "master" ]; then
            TAGS="${TAGS},${IMAGE}:master-${GITHUB_SHA::7}"
          fi
          [ -n "${{ github.event.inputs.version }}" ] && TAGS="${TAGS},${IMAGE}:${{ github.event.inputs.version }}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          # versão que o painel mostra: nextec/VERSION + commit (ex.: 2.0.1+1a2b3c4); tag v* e versão manual têm prioridade
          BASE="$(cat nextec/VERSION | tr -d '[:space:]')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; elif [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${BASE}+${GITHUB_SHA::7}"; fi
          echo "painel=${V}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) constrói e carrega localmente, sem publicar
      - name: Construir para teste
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nextec/docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
            NEXTEC_VERSION=${{ steps.v.outputs.painel }}
          load: true
          tags: rustdesk-nextec:teste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) teste de fumaça: o painel e a API precisam responder
      - name: Teste de fumaça
        run: |
          docker run -d --name teste -p 21114:21114 -e RELAY=teste.local:21117 rustdesk-nextec:teste
          ok=0
          for i in $(seq 1 40); do
            a=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:21114/_admin/ || true)
            b=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:21114/api/admin/config/app || true)
            if [ "$a" = "200" ] && [ "$b" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          docker logs teste | tail -20
          docker rm -f teste >/dev/null
          [ "$ok" = "1" ] || { echo "Painel ou API não responderam: imagem NÃO publicada."; exit 1; }

      # 3) publica (usa o cache do passo 1, sem reconstruir)
      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nextec/docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
            NEXTEC_VERSION=${{ steps.v.outputs.painel }}
          push: true
          tags: ${{ steps.v.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

      # 4) avisa o Portainer para refazer a stack e baixar a imagem nova (só na master).
      #    O endereço do webhook é segredo do repositório. Falha aqui não reprova o build:
      #    a imagem já foi publicada e o Portainer pode ser acionado de novo à mão.
      - name: Atualizar servidor (Portainer)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          [ -n "$PORTAINER_WEBHOOK_URL" ] || { echo "Sem PORTAINER_WEBHOOK_URL: pulando."; exit 0; }
          # certificado do Portainer é autoassinado (acesso por IP), por isso -k
          code=$(curl -ksS -o /dev/null -w '%{http_code}' -X POST --max-time 60 "$PORTAINER_WEBHOOK_URL")
          echo "Portainer respondeu HTTP $code"
          [ "$code" = "204" ] || [ "$code" = "200" ]

