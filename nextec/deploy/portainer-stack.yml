# Stack do Portainer: servidor RustDesk Nextec + painel + túnel da Cloudflare.
# O hbbs/hbbr ("servidor") fica em contêiner próprio, com versão fixa: atualizar o painel não derruba o acesso remoto.
# Variáveis (Portainer > Environment variables):
#   TUNNEL_TOKEN  obrigatória (token do túnel da Cloudflare)
#   DOMINIO       padrão remoto.nex.tec.br
#   URL_PAINEL    padrão https://painel-remoto.nex.tec.br
#   PASTA_DADOS   padrão /opt/rustdesk-nextec (guarda data/ e api/ no disco da VPS)
# Gerador de clientes (rdgen), em ${URL_PAINEL}/gerador. Variáveis do serviço "rdgen":
#   GERADOR_GH_USER      usuário do GitHub dono do repositório rdgen (padrão Sou-Nextec)
#   GERADOR_GH_TOKEN     obrigatória para o gerador (token do GitHub com permissão de Actions no repositório rdgen)
#   GERADOR_ZIP_SENHA    obrigatória para o gerador (a MESMA do segredo ZIP_PASSWORD do repositório rdgen)
#   GERADOR_SECRET_KEY   opcional (se vazia, o gerador cria uma chave aleatória e guarda no volume)
#   GERADOR_SH_SECRET    obrigatória para o gerador (senha da API do gerador; qualquer texto longo)
#   GERADOR_EMAILS_AUTORIZADOS  e-mails que podem gerar clientes, separados por vírgula (vazio = quem passa pelo Access)
# Os nomes originais do rdgen (GHBEARER, GHUSER, ZIP_PASSWORD, SECRET_KEY, SH_SECRET, GENURL) tambem sao aceitos no Portainer;
# se os dois existirem, vale o GERADOR_*.
#   Sem essas variáveis só o gerador não sobe; o painel e o servidor de ID não são afetados.
services:
  # hbbs + hbbr: IDs, relay e chave. Versão fixa (sem pull_policy always) para não reiniciar a cada atualização do painel.
  servidor:
    image: lejianwen/rustdesk-server-s6:v0.1.2
    container_name: rustdesk-servidor
    restart: unless-stopped
    # A chave publica precisa ser legivel pelo usuario sem privilegios do gerador; a privada continua restrita.
    # mesma base da imagem Nextec, só com o hbbs/hbbr ligados (a API roda no contêiner "rustdesk").
    # Os dois laços "nc" são o encaminhador de comandos: o hbbs/hbbr só aceitam comandos vindos de 127.0.0.1, então o painel
    # fala com servidor:21125 (hbbs) e servidor:21127 (hbbr), e o nc repassa pelo loopback. Essas portas não são publicadas
    # no host, só existem na rede interna da stack.
    entrypoint: ["sh", "-c", "rm -f /etc/s6-overlay/s6-rc.d/user/contents.d/api; (while [ ! -s /data/id_ed25519.pub ]; do sleep 1; done; chmod 0600 /data/id_ed25519; chmod 0644 /data/id_ed25519.pub) & (while :; do nc -lk -p 21125 -e nc 127.0.0.1 21115; sleep 1; done) & (while :; do nc -lk -p 21127 -e nc 127.0.0.1 21117; sleep 1; done) & exec /init"]
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21117:21117"
      - "21118:21118"
      - "21119:21119"
    environment:
      - TZ=America/Sao_Paulo
      - RELAY=${DOMINIO:-remoto.nex.tec.br}:21117
      - ENCRYPTED_ONLY=1
      - MUST_LOGIN=N
    volumes:
      # chave do servidor e cadastro de IDs (hbbs)
      - ${PASTA_DADOS:-/opt/rustdesk-nextec}/data:/data

  # Painel e API (imagem Nextec). O nome "rustdesk" é o que o túnel da Cloudflare aponta (rustdesk:21114).
  rustdesk:
    image: ghcr.io/sou-nextec/rustdesk-nextec:latest
    pull_policy: always
    container_name: rustdesk
    restart: unless-stopped
    # só a API: sem hbbs/hbbr/key-secret, que rodam no contêiner "servidor"
    entrypoint: ["sh", "-c", "cd /etc/s6-overlay/s6-rc.d && rm -f user/contents.d/hbbs user/contents.d/hbbr user/contents.d/key-secret && : > api/dependencies && exec /init"]
    # 21114 (painel e API) fica só na rede interna, para o cloudflared
    environment:
      - TZ=America/Sao_Paulo
      - RUSTDESK_API_LANG=pt-BR
      # comandos do hbbs/hbbr (Ajustes do servidor) pelo encaminhador do contêiner "servidor" (portas 21125 e 21127)
      - NEXTEC_SERVER_CMD_HOST=servidor
      - RUSTDESK_API_RUSTDESK_ID_SERVER=${DOMINIO:-remoto.nex.tec.br}:21116
      - RUSTDESK_API_RUSTDESK_RELAY_SERVER=${DOMINIO:-remoto.nex.tec.br}:21117
      - RUSTDESK_API_RUSTDESK_API_SERVER=${URL_PAINEL:-https://painel-remoto.nex.tec.br}
      - RUSTDESK_API_KEY_FILE=/data/id_ed25519.pub
      - RUSTDESK_API_RUSTDESK_KEY_FILE=/data/id_ed25519.pub
    volumes:
      # chave pública do servidor (só leitura)
      - ${PASTA_DADOS:-/opt/rustdesk-nextec}/data:/data:ro
      # banco do painel: usuários, listas, permissões e ajustes
      - ${PASTA_DADOS:-/opt/rustdesk-nextec}/api:/app/data

  # Gerador de clientes (rdgen). Não compila nada: dispara o build no GitHub Actions e recebe o resultado.
  # Fica em ${URL_PAINEL}/gerador (o túnel da Cloudflare aponta esse caminho para rdgen:8000).
  rdgen:
    image: ghcr.io/sou-nextec/rdgen-nextec:latest
    pull_policy: always
    container_name: rdgen
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TZ=America/Sao_Paulo
      - URL_PREFIX=/gerador
      - PROTOCOL=https
      - GENURL=${GENURL:-${URL_PAINEL:-https://painel-remoto.nex.tec.br}/gerador}
      - GHUSER=${GERADOR_GH_USER:-${GHUSER:-Sou-Nextec}}
      - GHBEARER=${GERADOR_GH_TOKEN:-${GHBEARER:-}}
      - GHBRANCH=master
      - REPONAME=rdgen
      - ZIP_PASSWORD=${GERADOR_ZIP_SENHA:-${ZIP_PASSWORD:-}}
      - SECRET_KEY=${GERADOR_SECRET_KEY:-${SECRET_KEY:-}}
      - SH_SECRET=${GERADOR_SH_SECRET:-${SH_SECRET:-}}
      # padrões Nextec: o formulário já vem com o servidor, a chave e a API, e esses campos ficam travados
      - NX_SERVER_HOST=${DOMINIO:-remoto.nex.tec.br}
      - NX_API_SERVER=${URL_PAINEL:-https://painel-remoto.nex.tec.br}
      - NX_KEY_FILE=/chave/id_ed25519.pub
      - NX_URL_LINK=${URL_PAINEL:-https://painel-remoto.nex.tec.br}
      - NX_DOWNLOAD_LINK=${URL_PAINEL:-https://painel-remoto.nex.tec.br}
      - NX_COMPANY=Nextec
      # só estas pessoas geram clientes (além do login do Access); vazio = quem passa pelo Access
      - NX_ALLOWED_EMAILS=${GERADOR_EMAILS_AUTORIZADOS:-}
      - NX_APP_NAME=Nextec-Connect
    volumes:
      # só a chave pública do servidor (a privada não entra neste contêiner)
      - ${PASTA_DADOS:-/opt/rustdesk-nextec}/data/id_ed25519.pub:/chave/id_ed25519.pub:ro
      # clientes gerados, imagens enviadas, pacotes temporários e banco (pedidos em andamento)
      - rdgen-exe:/opt/rdgen/exe
      - rdgen-png:/opt/rdgen/png
      - rdgen-zips:/opt/rdgen/temp_zips
      - rdgen-db:/opt/rdgen/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-painel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?defina TUNNEL_TOKEN}
    depends_on:
      - rustdesk
    # o gerador (rdgen:8000) responde pelo mesmo túnel, no caminho /gerador

volumes:
  rdgen-exe:
  rdgen-png:
  rdgen-zips:
  rdgen-db:
